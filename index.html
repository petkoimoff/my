<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение за управление на задачи</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css' rel='stylesheet' />
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Моите задачи</h1>
            <button id="enable-notifications-btn">Активирай известия</button>
        </header>
        <main>
            <div id="calendar-container">
                <!-- Календарът ще бъде зареден тук -->
            </div>
            <div id="tasks-container">
                <h2 id="tasks-header">Задачи за днес</h2>
                <ul id="task-list">
                    <!-- Списъкът със задачи ще бъде зареден тук -->
                </ul>
                <form id="add-task-form">
                    <input type="text" id="task-input" placeholder="Добавете нова задача..." required>
                    <input type="date" id="task-date">
                    <input type="time" id="task-time">
                    <button type="button" id="dictate-btn">Диктувай</button>
                    <button type="submit">Добави</button>
                </form>
            </div>
        </main>
    </div>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js'></script>
    <script src="script.js"></script>
</body>
</html>
